name: crawl-coverage
on:
  workflow_dispatch:
  workflow_run:
    workflows: [crawl, repair-od]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: crawl-coverage
  cancel-in-progress: false
jobs:
  status:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.DATA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python coverage.py
