name: crawl
run-name: "${{ inputs.source }} (${{ inputs.sample && 'sample' || 'full' }})"
# One source per run. Long crawls stop before the 6 h job limit, save their state to the private data repo and
# start the next run themselves. `sample` makes a few requests per stage and stores nothing.
on:
  workflow_dispatch:
    inputs:
      source:
        required: true
        type: choice
        options: [parliament, xacxom, legalinfo, shuukh, companies, registry, sanctions, egazar, iaac, shilendans_eza, shilendans_od, shilendans_reports, ebarimt, eiti, tender, tender_archive, opendatalab, supremecourt, conscourt, ub_khural, csc, mof, opendata_gov, frc, cmcs, election]
      sample:
        type: boolean
        default: false

concurrency:
  group: crawl-${{ inputs.source }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SRC: ${{ inputs.source }}
      DATA_REPO: mashbat1/gov-crawler
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore state
        if: ${{ !inputs.sample }}
        env:
          GH_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: python ci.py restore "$SRC"
      - name: Company registers for ebarimt
        if: ${{ inputs.source == 'ebarimt' }}
        env:
          GH_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          mkdir -p inputs
          tag=$(gh release list -R "$DATA_REPO" --limit 100 --json tagName,publishedAt --jq '[.[]|select(.tagName|startswith("lookup-inputs-"))]|sort_by(.publishedAt)|last|.tagName')
          [ -n "$tag" ] && [ "$tag" != "null" ] || { echo "Prepare lookup inputs first"; exit 1; }
          gh release download "$tag" -R "$DATA_REPO" -D inputs -p ebarimt_registers.json -p input_manifest.json
      - name: Crawl
        env:
          GH_TOKEN: ${{ secrets.DATA_TOKEN }}
          EBARIMT_REGISTERS: inputs/ebarimt_registers.json
          TENDER_API_TOKEN: ${{ secrets.TENDER_API_TOKEN }}
          TENDER_API_BASE: ${{ vars.TENDER_API_BASE || 'https://opendata.tender.gov.mn/api' }}
        run: python run.py "$SRC" ${{ inputs.sample && '--sample --budget-min 15' || '--budget-min 90' }}
      - name: Save to the data repo
        if: ${{ !inputs.sample && always() }}
        env:
          GH_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: python ci.py save "$SRC"
      - name: Continue in a new run
        if: ${{ !inputs.sample && hashFiles('work/CONTINUE') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run crawl.yml -R "$GITHUB_REPOSITORY" -f source="$SRC"
      - name: Refresh lookup input after registry publication
        if: ${{ !inputs.sample && (inputs.source == 'companies' || inputs.source == 'registry') && hashFiles('work/published.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run prepare-inputs.yml -R "$GITHUB_REPOSITORY"
